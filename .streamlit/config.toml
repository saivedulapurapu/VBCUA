# Streamlit settings for the VBCUA dashboard (read when run from the repo root)

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#0f172a"
font = "sans serif"

[client]
# Hide the Deploy button and developer menu
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
