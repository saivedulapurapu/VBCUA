<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explain a computing concept out loud and get feedback on your understanding and delivery." />
    <title>VBCUA · Concept Understanding Analyser</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("vbcua-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
